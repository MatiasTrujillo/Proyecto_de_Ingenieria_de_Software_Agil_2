services:
  pharmago-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pharmago-api
    environment:
      - ConnectionStrings__DefaultConnection=Server=pharmago-db;Database=PharmaDb;User Id=sa;Password=Str0ngP@ssword!
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:80"
    depends_on:
      - pharmago-db
      - otlp-collector

  pharmago-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: pharmago-db
    environment:
      - SA_PASSWORD=Str0ngP@ssword!
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"

  otlp-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otlp-collector
    ports:
      - "4317:4317"
