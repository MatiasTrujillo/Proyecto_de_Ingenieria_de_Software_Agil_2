name: Build, Test & Coverage

on:
  pull_request:
    branches: [ main ]

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ObligD2/Codigo/Backend/PharmaGo.sln

      - name: Build
        run: dotnet build ObligD2/Codigo/Backend/PharmaGo.sln --no-restore --configuration Release

      - name: Verify test project exists
        run: |
          echo "Verifying project structure..."
          find . -name "PharmaGo.Test.csproj" -type f
          ls -la ObligD2/Codigo/Backend/PharnaGo.Test/ || echo "Directory not found"

      - name: Run unit tests with coverage (excluyendo migraciones)
        run: |
          dotnet test PharnaGo.Test/PharmaGo.Test.csproj --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*"
        working-directory: ObligD2/Codigo/Backend

      - name: Report coverage (solo backend, sin migraciones)
        uses: danielpalme/ReportGenerator-GitHub-Action@5.2.4
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'HtmlInline;Cobertura'
          assemblyfilters: '+PharmaGo.*;-*.Migrations'

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Enforce minimum coverage
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+(?=")' coverage-report/Cobertura.xml | head -1)
          echo "Coverage: $COVERAGE"
          MIN_COVERAGE=0.10
          awk -v c=$COVERAGE -v min=$MIN_COVERAGE 'BEGIN {exit (c<min)?1:0}'
        shell: bash