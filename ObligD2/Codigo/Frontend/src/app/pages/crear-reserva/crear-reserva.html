<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3>Crear Reserva</h3>
          <p class="text-muted">Ingrese medicamento y cantidad</p>

          <form (submit)="goReserve(); $event.preventDefault()">
            <div class="mb-3">
              <label class="form-label">Medicamento</label>
              <select
                class="form-control"
                [value]="medicamento"
                (change)="medicamento = $any($event.target).value"
                id="nombreMedicamento"
              >
                <option value="" disabled [selected]="!medicamento">Seleccione medicamento</option>
                <option *ngFor="let m of medicamentos" [value]="m">{{ m }}</option>
              </select>
              <div *ngIf="errorNombre" id="errorNombre">Por favor seleccione un medicamento</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Cantidad</label>
              <input
                class="form-control"
                type="number"
                min="1"
                [value]="cantidad"
                (input)="cantidad = $any($event.target).valueAsNumber"
                placeholder="Cantidad"
                id="cantidadMedicamento"
              />
              <div *ngIf="errorCantidad" id="errorCantidad">Debe ingresar una cantidad</div>
            </div>

            <div class="d-grid">
              <button class="btn btn-primary" type="submit" id="botonReservar">
                Reservar
              </button>
            </div>
          </form>
          <div *ngIf="errorStock" id="errorStock">No hay stock disponible</div>
        </div>
      </div>
    </div>
  </div>
</div>
